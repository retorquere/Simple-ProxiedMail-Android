name: Build the app

on:
  push:
    branches:
      - proxiedmail

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/simplelogin.keystore

      - name: Build application
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          cp app/build/outputs/apk/playstore/release/app-playstore-release.apk apks/
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk apks/

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/